apiVersion: apps/v1
kind: Deployment
metadata:
  name: pharmaflow-nginx
  namespace: pharmaflow-dev

spec:
  replicas: 2

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  minReadySeconds: 10

  selector:
    matchLabels:
      app: pharmaflow-nginx

  template:
    metadata:
      labels:
        app: pharmaflow-nginx

    spec:
      terminationGracePeriodSeconds: 45

      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: pharmaflow-nginx
          matchLabelKeys:
            - pod-template-hash

        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: pharmaflow-nginx
          matchLabelKeys:
            - pod-template-hash

      containers:
        - name: nginx

          # Replaced with the sha-<commit> ECR image during deployment integration.
          image: REPLACE-WITH-NGINX-ECR-REPOSITORY-URL:REPLACE-WITH-IMAGE-TAG
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 80
              protocol: TCP

          readinessProbe:
            httpGet:
              path: /health/ready/
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health/live/
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi

          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - sleep 15

          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/pharmaflow.conf
              subPath: pharmaflow.conf
              readOnly: true

            - name: static
              mountPath: /vol/static
              readOnly: true

            - name: media
              mountPath: /vol/media
              readOnly: true

      volumes:
        - name: nginx-config
          configMap:
            name: pharmaflow-nginx-config

        # Shared storage provided by Amazon EFS CSI through RWX PVCs.
        - name: static
          persistentVolumeClaim:
            claimName: pharmaflow-static

        - name: media
          persistentVolumeClaim:
            claimName: pharmaflow-media
