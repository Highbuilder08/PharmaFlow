apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: django
  namespace: pharmaflow-dev
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: django

  minReplicas: 2
  maxReplicas: 3

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60

  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
