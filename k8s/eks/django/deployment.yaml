apiVersion: apps/v1
kind: Deployment
metadata:
  name: django
  namespace: pharmaflow-dev
  labels:
    app: django

spec:
  replicas: 2

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  minReadySeconds: 10

  selector:
    matchLabels:
      app: django

  template:
    metadata:
      labels:
        app: django

    spec:
      terminationGracePeriodSeconds: 45

      securityContext:
        runAsNonRoot: true
        fsGroup: 999

      containers:
        - name: django
          image: REPLACE-WITH-DJANGO-ECR-REPOSITORY-URL:REPLACE-WITH-IMAGE-TAG
          imagePullPolicy: IfNotPresent

          securityContext:
            runAsUser: 999
            runAsGroup: 999

          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          envFrom:
            - configMapRef:
                name: pharmaflow-config
            - secretRef:
                name: pharmaflow-secret

          volumeMounts:
            - name: static-data
              mountPath: /app/staticfiles
            - name: media-data
              mountPath: /app/media

          livenessProbe:
            httpGet:
              path: /health/live/
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health/ready/
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - sleep 15

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

      # EKS 전환: AWS 클라우드 프로바이더가 채워주는 topology.kubernetes.io/zone 기준으로
      # AZ 분산 (로컬 kubeadm 검증 때는 이 레이블이 없어서 kubernetes.io/hostname 사용).
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: django
          matchLabelKeys:
            - pod-template-hash

        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: django
          matchLabelKeys:
            - pod-template-hash

      # EKS 전환: EFS CSI 기반 ReadWriteMany PVC로 교체 (로컬 검증 때는 emptyDir).
      # Nginx도 같은 정적/미디어 파일을 서빙해야 하므로 이 PVC를 그대로 마운트해야 함
      # (별도 PVC를 새로 만들면 EFS 동적 프로비저닝 특성상 서로 다른 디렉터리가 생겨
      # 파일 공유가 깨짐 - pvc.yaml 참고).
      volumes:
        - name: static-data
          persistentVolumeClaim:
            claimName: pharmaflow-static
        - name: media-data
          persistentVolumeClaim:
            claimName: pharmaflow-media
