# Static/Media는 Django(2+ replica)와 Nginx 양쪽에서 동시에 읽고 써야 하므로
# ReadWriteMany가 필수 (EBS는 RWO만 지원하므로 EFS CSI 전제).
#
# 이름을 django-*가 아니라 pharmaflow-*로 둔 이유: Nginx Deployment도 같은 파일을
# 서빙해야 해서 이 PVC를 그대로 마운트해야 함 (k8s/nginx/deployment.yaml의
# static/media emptyDir을 EFS CSI로 바꿀 때 이 PVC를 참조하도록 조율 필요).
#
# 팀장 지시(수정본): 이 PVC는 최종적으로 공통 Storage 영역에서 한 번만 관리할
# 예정이라, 이 파일 자체는 통합 단계에서 제거될 수 있음. 그때까지는 Django
# Deployment가 아래 이름(pharmaflow-static/pharmaflow-media)을 그대로 참조하도록
# 여기서 정의해둔다.
#
# storageClassName은 EFS CSI 애드온/StorageClass 이름이 확정되면 교체.
# (아직 미확정이라 플레이스홀더로 둠 - 인프라팀 EFS CSI 설정과 맞춰야 함)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pharmaflow-static
  namespace: pharmaflow-dev
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: efs-sc # REPLACE-WITH-EFS-STORAGECLASS-NAME
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pharmaflow-media
  namespace: pharmaflow-dev
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: efs-sc # REPLACE-WITH-EFS-STORAGECLASS-NAME
  resources:
    requests:
      storage: 20Gi
