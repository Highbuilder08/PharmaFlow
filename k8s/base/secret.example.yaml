# 템플릿입니다. secret.yaml 로 복사한 뒤 실제 값을 채우고, 이 저장소에는 커밋하지 마세요.
#
#   cp secret.example.yaml secret.yaml
#   vi secret.yaml            # 실제 값 채우기 (stringData 이므로 base64 인코딩 불필요)
#   kubectl apply -f secret.yaml
#
apiVersion: v1
kind: Secret
metadata:
  name: pharmaflow-secret
  namespace: pharmaflow-dev
type: Opaque
stringData:
  DJANGO_SECRET_KEY: "REPLACE-ME"
  DB_PASSWORD: "REPLACE-ME"
  # SES SMTP 자격증명 미발급 시 비워둬도 됨 (env.j2/settings.py가 default("") 처리)
  EMAIL_HOST_USER: "REPLACE-ME"
  EMAIL_HOST_PASSWORD: "REPLACE-ME"
  HIRA_SERVICE_KEY: "REPLACE-ME"
