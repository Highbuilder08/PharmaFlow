<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}PharmaFlow{% endblock %}
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        html,
        body {
            max-width: 100%;
            overflow-x: hidden;
        }

        img {
            max-width: 100%;
            height: auto;
        }

        .table-scroll {
            width: 100%;
            overflow-x: auto;
        }

        .table-scroll .table {
            width: 100%;
            min-width: 900px;
            margin-bottom: 0;
        }

        /* 공통 목록 테이블 가로 스크롤 */
        .app-table-scroll {
            width: 100%;
            overflow-x: auto;
            overflow-y: hidden;
            -webkit-overflow-scrolling: touch;
        }

        /* 목록 테이블 기본 크기 유지 */
        .app-table-scroll .table {
            width: 100%;
            min-width: 900px;
            margin-bottom: 0;
        }

        /* 헤더와 데이터가 두 줄로 나뉘지 않게 처리 */
        .app-table-scroll .table th,
        .app-table-scroll .table td {
            white-space: nowrap;
            vertical-align: middle;
        }

        @media (max-width:768px){

            .page-actions-responsive .btn{

                white-space:nowrap;

                font-size:.9rem;

                padding:.5rem .75rem;

            }

        }

        @media (max-width: 576px) {
            .container {
                width: 100%;
                max-width: 100%;
                padding-left: 12px;
                padding-right: 12px;
            }

            .page-header-responsive {
                flex-direction: column;
                align-items: stretch !important;
                gap: 16px;
            }

            .page-actions-responsive {
                width: 100%;
                flex-direction: column;
                align-items: stretch !important;
            }

            .page-actions-responsive .btn {
                width: 100%;
                font-size:1rem;
            }

            .stock-filter-row {
                align-items: stretch !important;
                gap: 12px !important;
            }

            .stock-filter-row > div {
                display: flex;
                flex-wrap: wrap;
            }

            .stock-filter-row .btn {
                white-space: nowrap;
            }

            .filter-row-responsive {
                flex-direction: column;
                align-items: stretch !important;
            }

            .filter-row-responsive > * {
                width: 100% !important;
                max-width: 100% !important;
            }

            .filter-row-responsive .btn {
                width: 100%;
            }

            .table {
                font-size: 0.875rem;
            }

            .table th,
            .table td {
                white-space: normal;
                word-break: keep-all;
            }
        }
    </style>
</head>

<body>
    <main class="container py-4">

        <!-- Django messages 출력 영역 -->
        {% if messages %}
            {% for message in messages %}
                <div
                    class="alert alert-{{ message.tags }} alert-dismissible fade show"
                    role="alert"
                >
                    {{ message }}

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="alert"
                        aria-label="닫기"
                    ></button>
                </div>
            {% endfor %}
        {% endif %}

        {% block content %}
        {% endblock %}
        
    </main>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
    ></script>
</body>
</html>
