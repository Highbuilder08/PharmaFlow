{% extends "inventory/base.html" %}

{% block title %}
의약품 삭제 | PharmaFlow
{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h1 class="h3 mb-3">
                    의약품 삭제
                </h1>

                <div class="alert alert-warning">
                    다음 의약품을 정말 삭제하시겠습니까?
                </div>

                <dl class="row mb-4">
                    <dt class="col-sm-4">의약품명</dt>
                    <dd class="col-sm-8">{{ medicine.name }}</dd>

                    <dt class="col-sm-4">제조사</dt>
                    <dd class="col-sm-8">{{ medicine.manufacturer }}</dd>

                    <dt class="col-sm-4">현재 재고</dt>
                    <dd class="col-sm-8">{{ medicine.stock }}개</dd>
                </dl>

                <form method="post">
                    {% csrf_token %}

                    <div class="d-flex justify-content-end gap-2">
                        <a
                            href="{% url 'inventory:medicine_detail' medicine.pk %}"
                            class="btn btn-outline-secondary"
                        >
                            취소
                        </a>

                        <button
                            type="submit"
                            class="btn btn-danger"
                        >
                            삭제
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
