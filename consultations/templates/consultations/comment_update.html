{% extends 'base.html' %}
{% block content %}

<h2>💬 댓글 수정</h2>

<div style="background-color: #f8f9fa; padding: 20px; border-radius: 5px; border: 1px solid #ddd; margin-bottom: 20px;">
    <form method="POST">
        {% csrf_token %}
        
        <p style="color: #666; font-size: 14px; margin-bottom: 10px;">
            <strong>원래 게시글:</strong> {{ comment.consultation.title }}
        </p>
        
        <input type="text" name="content" value="{{ comment.content }}" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px;">
        
        <div style="margin-top: 15px;">
            <button type="submit" class="btn">수정 완료</button>
            <a href="{% url 'consultations:detail' comment.consultation.id %}" class="btn" style="background-color: #6c757d;">취소</a>
        </div>
    </form>
</div>

{% endblock %}
