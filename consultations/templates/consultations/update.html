{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-lg-8">
        <div class="card shadow-sm border-0 rounded-3">
            <div class="card-header bg-white border-bottom-0 pt-4 pb-0">
                <h3 class="fw-bold" style="color: #2c3e50;">✏️ 게시글 수정</h3>
            </div>
            <div class="card-body p-4">
                <form method="POST" enctype="multipart/form-data">
                    {% csrf_token %}
                    {{ form.as_p }}

                    <div class="mt-4 mb-4 p-3 bg-light rounded border">
                        <label class="fw-bold mb-2">📎 추가 첨부파일</label>
                        <input type="file" name="attachments" multiple class="form-control bg-white">
                    </div>
                    
                    <div class="d-flex justify-content-end gap-2">
                        <a href="{% url 'consultations:detail' consultation.id %}" class="btn btn-light border shadow-sm px-4">취소</a>
                        <button type="submit" class="btn btn-success shadow-sm px-4">수정완료</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
