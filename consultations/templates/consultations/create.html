{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-lg-8">
        <div class="card shadow-sm border-0 rounded-3">
            <div class="card-header bg-white border-bottom-0 pt-4 pb-0">
                <h3 class="fw-bold" style="color: #2c3e50;">✏️ 게시글 쓰기</h3>
            </div>
            <div class="card-body p-4">
                <form method="POST" enctype="multipart/form-data">
                    {% csrf_token %}
                    {{ form.as_p }}
                    
                    <div class="mt-4 mb-4 p-3 bg-light rounded border">
                        <label class="fw-bold mb-2">📎 첨부파일</label>
                        <input type="file" name="attachments" multiple class="form-control bg-white" id="file-input">
                        
                        <div id="file-list" class="mt-3 d-flex flex-column gap-2"></div>
                    </div>
                    
                    <div class="d-flex justify-content-end gap-2">
                        <a href="{% url 'consultations:list' %}" class="btn btn-light border shadow-sm px-4">취소</a>
                        <button type="submit" class="btn btn-primary shadow-sm px-4">작성완료</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    const fileInput = document.getElementById('file-input');
    const fileListContainer = document.getElementById('file-list');
    let selectedFiles = []; // 선택된 파일들을 담아둘 배열

    // 1. 파일이 선택될 때마다 실행
    fileInput.addEventListener('change', function(e) {
        // 새로 선택한 파일들을 기존 배열에 누적해서 합칩니다
        const newFiles = Array.from(e.target.files);
        selectedFiles = selectedFiles.concat(newFiles);
        
        updateFileInput(); // 실제 input 태그에 반영
        renderFileList();  // 화면에 예쁘게 그리기
    });

    function renderFileList() {
        fileListContainer.innerHTML = ''; // 일단 화면을 싹 비움
        
        selectedFiles.forEach((file, index) => {
            const fileItem = document.createElement('div');
            fileItem.className = 'd-flex align-items-center justify-content-between bg-white border rounded px-3 py-2 shadow-sm';
            
            fileItem.innerHTML = `
                <span class="text-truncate text-secondary fw-bold" style="max-width: 85%; font-size: 14px;">
                    📄 ${file.name}
                </span>
                <button type="button" class="btn btn-outline-danger btn-sm py-0 px-2" onclick="removeFile(${index})">✕</button>
            `;
            fileListContainer.appendChild(fileItem);
        });
    }

    window.removeFile = function(index) {
        selectedFiles.splice(index, 1); // 배열에서 빼기
        updateFileInput(); // 실제 input 태그에 반영
        renderFileList();  // 화면 다시 그리기
    };

    function updateFileInput() {
        const dataTransfer = new DataTransfer();
        selectedFiles.forEach(file => {
            dataTransfer.items.add(file);
        });
        fileInput.files = dataTransfer.files;
    }
</script>
{% endblock %}
