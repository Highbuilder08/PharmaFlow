name: Django CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  django-check:
    runs-on: ubuntu-latest

    env:
      DJANGO_SECRET_KEY: github-actions-test-secret-key
      DJANGO_DEBUG: "False"
      DB_ENGINE: django.db.backends.sqlite3
      HIRA_SERVICE_KEY: test-key

    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django 설정 검사
        run: |
          python manage.py check

      - name: 마이그레이션 파일 검사
        run: |
          python manage.py makemigrations --check --dry-run

      - name: Django 테스트
        run: |
          python manage.py test
