{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>PharmaFlow 테스트</title>
    
    <link rel="stylesheet" href="{% static 'prescriptions/style.css' %}">
</head>
<body>
    <header>
        <h1>💊 PharmaFlow (개발자 3 테스트 화면)</h1>
        <nav>
            <a href="{% url 'prescriptions:list' %}">처방전 목록</a>
            <a href="{% url 'consultations:list' %}">상담 게시판</a>

            {% if request.user.is_superuser %}
                <a href="{% url 'prescriptions:audit_logs' %}" style="color: #ffc107;">[관리자] 시스템 로그</a>
            {% endif %}
        </nav>
    </header>

    <main>
        {% if messages %}
            {% for message in messages %}
                <script>
                    alert("{{ message }}");
                </script>
            {% endfor %}
        {% endif %}

        {% block content %}
        {% endblock %}
    </main>

</body>
</html>
