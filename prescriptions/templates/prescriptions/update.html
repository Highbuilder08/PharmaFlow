{% extends 'base.html' %}
{% block content %}
<h2>처방전 수정</h2>
<form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <p><label>추가 첨부파일:</label> <input type="file" name="attachments" multiple></p>
    <button type="submit">수정완료</button>
    <a href="{% url 'prescriptions:detail' prescription.id %}">취소</a>
</form>
{% endblock %}
