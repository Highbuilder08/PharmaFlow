{% extends 'base.html' %}

{% block content %}
<h2>처방전 목록</h2>
<a href="{% url 'prescriptions:create' %}">새 처방전 등록</a>

<table border="1">
    <thead>
        <tr>
            <th>번호</th>
            <th>환자명</th>
            <th>처방일</th>
            <th>작성자(약사)</th>
        </tr>
    </thead>
    <tbody>
        {% for p in prescriptions %}
        <tr>
            <td>{{ p.id }}</td>
            <td><a href="{% url 'prescriptions:detail' p.id %}">{{ p.patient_name }}</a></td>
            <td>{{ p.prescription_date }}</td>
            <td>{{ p.writer.username }}</td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="4">등록된 처방전이 없습니다.</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
