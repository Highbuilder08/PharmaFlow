{% extends 'base.html' %}
{% block content %}

<!-- 상단 제목과 버튼을 양쪽으로 깔끔하게 배치 -->
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold mb-0" style="color: #2c3e50;">💊 처방전 관리</h2>
    <a href="{% url 'prescriptions:create' %}" class="btn btn-primary shadow-sm fw-bold">+ 새 처방전 등록</a>
</div>

<!-- 표를 감싸는 예쁜 그림자 카드 -->
<div class="card shadow-sm border-0 rounded-3">
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light text-center">
                    <tr>
                        <th>번호</th>
                        <th>환자명</th>
                        <th>처방일</th>
                        <th>작성자</th>
                        <th>작성일</th>
                    </tr>
                </thead>
                <tbody class="text-center">
                    {% for p in prescriptions %}
                    <tr>
                        <td class="text-muted">{{ p.id }}</td>
                        <td class="fw-bold">
                            <!-- 🚀 text-decoration-none으로 밑줄을 없애고, custom-link로 마우스 오버 효과를 줍니다 -->
                            <a href="{% url 'prescriptions:detail' p.id %}" class="text-dark text-decoration-none custom-link">
                                {{ p.patient_name }}
                            </a>
                        </td>
                        <td>{{ p.prescription_date }}</td>
                        <td>{{ p.writer.username }}</td>
                        <td class="text-muted">{{ p.smart_date }}</td>
                    </tr>
                    {% empty %}
                    <tr>
                        <td colspan="5" class="text-center text-muted py-5">등록된 처방전이 없습니다.</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>

<div class="d-flex justify-content-center mt-4 mb-5">
    <!-- width를 500px에서 600px로 넉넉하게 늘렸습니다 -->
    <form method="GET" action="" class="d-flex gap-2" style="max-width: 600px; width: 100%;">
        
        <!-- 검색 조건 선택 드롭다운 (flex-shrink-0으로 찌그러짐 방지) -->
        <select name="search_type" class="form-select shadow-sm" style="width: 130px; flex-shrink: 0;">
            <option value="all" {% if search_type == 'all' %}selected{% endif %}>전체</option>
            <!-- 처방전은 'patient', 게시판은 'title'로 알맞게 적어주세요! -->
            <option value="patient" {% if search_type == 'patient' %}selected{% endif %}>환자명</option>
            <option value="writer" {% if search_type == 'writer' %}selected{% endif %}>작성자</option>
        </select>
        
        <!-- 검색어 입력칸 -->
        <input type="text" name="q" class="form-control shadow-sm" placeholder="검색어를 입력하세요" value="{{ q }}">
        
        <!-- 검색 버튼 (text-nowrap과 flex-shrink-0으로 세로 꺾임 완벽 방지!) -->
        <button type="submit" class="btn btn-secondary shadow-sm px-4 text-nowrap" style="flex-shrink: 0;">검색</button>
    </form>
</div>

<!-- 마우스를 올렸을 때만 파란색으로 변하게 하는 미세한 디테일 -->
<style>
    .custom-link { transition: color 0.2s ease-in-out; }
    .custom-link:hover { color: #0d6efd !important; }
</style>

{% endblock %}
