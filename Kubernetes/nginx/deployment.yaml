apiVersion: apps/v1
kind: Deployment
metadata:
  name: pharmaflow-nginx
  namespace: pharmaflow-dev

spec:
  replicas: 2

  selector:
    matchLabels:
      app: pharmaflow-nginx

  template:
    metadata:
      labels:
        app: pharmaflow-nginx

    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: pharmaflow-nginx

      containers:
        - name: nginx

          # Replaced with the sha-<commit> ECR image during deployment integration.
          image: 962450756907.dkr.ecr.ap-northeast-2.amazonaws.com/pharmaflow-nginx:IMAGE_TAG
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 80
              protocol: TCP

          readinessProbe:
            httpGet:
              path: /health/ready/
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health/live/
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/pharmaflow.conf
              subPath: pharmaflow.conf
              readOnly: true

            - name: static
              mountPath: /vol/static
              readOnly: true

            - name: media
              mountPath: /vol/media
              readOnly: true

      volumes:
        - name: nginx-config
          configMap:
            name: pharmaflow-nginx-config

        # Local validation only.
        # EFS CSI / RWX PVC will replace these in the EKS integration stage.
        - name: static
          emptyDir: {}

        - name: media
          emptyDir: {}
